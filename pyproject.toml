[project]
name = "infra-cost-model"
# Single source of truth is infra_cost_model/__init__.py. The model's
# requiresEngine pin is checked against that value, so a second copy
# here would let the enforced version and the reported one drift.
dynamic = ["version"]
description = "DAG-based infrastructure cost model with usage derivation and pricing"
readme = "README.md"
requires-python = ">=3.10"
# An SPDX expression (PEP 639). setuptools rejects a "License ::" classifier
# next to it, so the classifiers below leave that one out.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Marchildon" }]
keywords = [
    "infrastructure-as-code",
    "cost-modeling",
    "cloud-costs",
    "dag",
    "finops",
    "aws",
    "gcp",
    "azure",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "jsonschema>=4.0",
    # PEP 440 comparison for a model's `requiresEngine` pin. Imported by the
    # engine and the CLI, so a minimal install needs it declared here rather
    # than relying on it arriving with pytest or jsonschema.
    "packaging>=22.0",
    "pyyaml>=6.0",
    "requests>=2.0",
    "rich>=13.0",
]

[project.scripts]
infra-cost-model = "infra_cost_model.cli:main"

[project.urls]
Homepage = "https://github.com/elecnix/infra-cost-model"
Repository = "https://github.com/elecnix/infra-cost-model"
Issues = "https://github.com/elecnix/infra-cost-model/issues"
Changelog = "https://github.com/elecnix/infra-cost-model/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Builds the documentation site: `mkdocs build --strict` (#243). MkDocs 2.0
# drops the plugin and hook system that mkdocs-material and docs/hooks.py use.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[build-system]
# 77.0 is the first release that reads `license` as an SPDX expression.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "infra_cost_model.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["infra_cost_model*"]

[tool.setuptools.package-data]
"infra_cost_model.vendors" = ["*/vendor.yaml", "*/prices.yaml"]
"infra_cost_model.schema" = ["*.json"]
"infra_cost_model.pricing" = ["seed/*.json"]
