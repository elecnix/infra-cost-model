[project]
name = "infra-cost-model"
version = "0.1.0"
description = "DAG-based infrastructure cost model with usage derivation and pricing"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
    "requests>=2.0",
    "rich>=13.0",
]

[project.scripts]
infra-cost-model = "infra_cost_model.cli:main"

# SaaS pricing-shape handler discovery (#241). Third-party packages register
# additional shapes by adding an entry-point to this group:
#
#   [project.entry-points."infra_cost_model.saas_handlers"]
#   my_shape = "my_package.pricing:my_handler"
#
# The callable must match the SaaSCostHandler protocol
# (quantity, params) -> monthly_cost_usd.
[project.entry-points."infra_cost_model.saas_handlers"]
flat_subscription = "infra_cost_model.saas.pricing_shapes:flat_subscription"
per_unit_flat = "infra_cost_model.saas.pricing_shapes:per_unit_flat"
free_tier = "infra_cost_model.saas.pricing_shapes:free_tier"
transactional = "infra_cost_model.saas.pricing_shapes:transactional"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["infra_cost_model*"]