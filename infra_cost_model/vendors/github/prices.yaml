# GitHub Copilot plans, one metric pair per plan.
# Copilot Business uses the unprefixed Copilot-Seat-Month and Copilot-Credit
# metrics. Copilot Enterprise uses the same layout with an Enterprise prefix.
# Both scale the pooled credit allowance with the `seats` parameter.
# Individual plans (Pro, Pro-Plus, Max) have one subscription row priced per
# month and a fixed credit allowance.
- vendor: github
  service: Copilot
  region: global
  usage_metric: Copilot-Seat-Month
  unit: seats
  price_usd: 19.00
  per: seats
  effective_date: 2026-06-01
  source: https://docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-organizations-and-enterprises

- vendor: github
  service: Copilot
  region: global
  usage_metric: Copilot-Credit
  unit: credits
  price_usd: 0.00
  start_usage_amount: 0
  end_usage_amount: 1900
  per: seats
  effective_date: 2026-06-01
  source: https://docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-organizations-and-enterprises

