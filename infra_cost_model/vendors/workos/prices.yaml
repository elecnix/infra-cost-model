# WorkOS prices, read from https://workos.com/pricing on 2026-09-24. The page
# states no effective date, so effective_date is the date the page was read.
#
# AuthKit: the first 1,000,000 monthly active users are free. WorkOS bills
# each additional block of 1,000,000 at $2,500 a month. A price row has no
# block unit, so the overage row spreads that price over each user
# ($0.0025), which understates a partly used block.
- vendor: workos
  service: WorkOS
  region: global
  usage_metric: AuthKit-MAU
  unit: users
  price_usd: 0.0
  start_usage_amount: 0
  end_usage_amount: 1000000
  effective_date: 2026-09-24
  source: https://workos.com/pricing
- vendor: workos
  service: WorkOS
  region: global
  usage_metric: AuthKit-MAU
  unit: users
  price_usd: 0.0025
  start_usage_amount: 1000000
  effective_date: 2026-09-24
  source: https://workos.com/pricing

# Single Sign-On, per connection a month: $125 for connections 1 to 15, $100
