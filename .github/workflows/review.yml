name: review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: cite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    # Over the last 73 successful runs, the median took 222 s, the 90th
    # percentile 826 s, and the longest 2,013 s (about 34 minutes). The limit
    # is above the longest run and stops a hung run within the hour (#344).
    timeout-minutes: 45
    steps:
      - name: Review this pull request with Cite
        uses: elecnix/cite@7bbe8f051e9df569744c18e0fa8285f4129c1c79  # v0.10.0
        with:
          model_id: deepseek/deepseek-v4-flash-0731
          model_base_url: https://openrouter.ai/api/v1
          model_api_key: ${{ secrets.MODEL_API_KEY }}
