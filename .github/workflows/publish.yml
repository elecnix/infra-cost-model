# Publishes the package to PyPI when a GitHub release is published (#243).
#
# PyPI trusts this workflow through trusted publishing (OpenID Connect), so
# the repository stores no PyPI token. CONTRIBUTING.md lists the one-time
# setup on pypi.org and in the repository settings.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A release tagged v0.3.0 must publish version 0.3.0. Read the version
      # from the source with `ast`, so this step needs no installed package.
      - name: Check the tag matches __version__
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python - <<'EOF'
          import ast
          import pathlib

          tree = ast.parse(pathlib.Path("infra_cost_model/__init__.py").read_text())
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  getattr(target, "id", None) == "__version__" for target in node.targets
              ):
                  print(node.value.value)
          EOF
          )
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG doesn't match __version__ $version (expected v$version)" >&2
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The pypi.org trusted publisher names this environment, so a run from
    # any other workflow or environment can't publish.
    environment:
      name: pypi
      url: https://pypi.org/p/infra-cost-model
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
