name: PR Tests

on:
  # Every pull request runs these jobs, whatever its base branch. A
  # repository ruleset requires them before a merge into main. A stacked PR
  # keeps its head commit when GitHub moves its base to main, so runs from
  # while it targeted another branch still count. With a `branches: [main]`
  # filter, that PR would have no runs and would wait until someone closed
  # and reopened it.
  pull_request:

jobs:
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce vendor-only changes
        run: |
          # A contributor adding a vendor should touch only that vendor's
          # directory, so two such pull requests never conflict. The guard
          # applies to changes since this PR's own base, not since main: a
          # stacked PR's diff against main includes every vendor the PRs below
          # it added, which would read a docs-only PR as a vendor change.
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          base="origin/${base_ref}"

          new_vendors=$(git diff --name-only "$base"...HEAD | grep '^vendors/[^/]*/prices.yaml' | sed 's|/prices.yaml||' | sort -u || true)
          if [ -z "$new_vendors" ]; then
            echo "vendor-only check passed (this PR adds no vendor)"
            exit 0
          fi

          # A PR adding the pricing mechanism rather than a vendor — the loader,
          # the schema, a new shape — legitimately adds a vendor directory and
          # touches engine code. It opts out by naming the reason in a commit
          # message, so the exception shows up in the history rather than being
          # implied by a path filter.
          if git log --format=%B "$base"..HEAD | grep -qx 'vendor-check: mechanism'; then
            echo "vendor-only check skipped: this PR declares itself the mechanism"
            echo "vendors added: $(echo "$new_vendors" | tr '\n' ' ')"
            exit 0
          fi

          bad=$(git diff --name-only "$base"...HEAD | grep -v '^vendors/' | grep -v '^\.github/' | grep -v '^sdk/ts/src/types\.generated\.ts' | head || true)
          if [ -n "$bad" ]; then
            echo "Vendor PR must only touch vendors/*/: $bad"
            echo "A PR adding the mechanism rather than a vendor should put 'vendor-check: mechanism' on its own line in a commit message."
            exit 1
          fi
          echo "vendor-only check passed"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd sdk/ts
          npm install

      - name: Check types staleness
        run: |
          cd sdk/ts
          npm run build:types
          git diff --exit-code src/types.generated.ts

      - name: Run TS tests
        run: |
          cd sdk/ts
          npm test
