name: PR Tests

on:
  pull_request:
    branches: [main]

jobs:
  vendor-check:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce vendor-only changes
        run: |
          new_vendors=$(git diff --name-only origin/main...HEAD | grep '^vendors/[^/]*/prices.yaml' | sed 's|/prices.yaml||' | sort -u || true)
          if [ -n "$new_vendors" ]; then
            bad=$(git diff --name-only origin/main...HEAD | grep -v '^vendors/' | grep -v '^\.github/' | grep -v '^sdk/ts/src/types\.generated\.ts' | head || true)
            if [ -n "$bad" ]; then
              echo "Vendor PR must only touch vendors/*/: $bad"
              exit 1
            fi
          fi
          echo "vendor-only check passed"

  test:
    runs-on: arc-runners
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  ts:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd sdk/ts
          npm install

      - name: Check types staleness
        run: |
          cd sdk/ts
          npm run build:types
          git diff --exit-code src/types.generated.ts

      - name: Run TS tests
        run: |
          cd sdk/ts
          npm test
