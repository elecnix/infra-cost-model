name: PR Body Format

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check once the author fixes the body — without it
    # the original red result stands.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-format:
    runs-on: arc-runners
    steps:
      - uses: elecnix/gh-pr-body-action@v1
