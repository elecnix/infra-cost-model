# Example: SaaS subscription stack (Vercel + WorkOS + Datadog)
# Demonstrates: declarative SaaS pricing shapes, the engine pin that keeps them
# honest, and per-unit / free-tier / flat-subscription pricing on non-IaC nodes.
#
# Issue: https://github.com/elecnix/infra-cost-model/issues/241

version: "1.0"

# The SaaS `shape` vocabulary is an engine feature. An engine without shape
# dispatch prices each of these metrics at $0 and reports a total that looks
# reasonable, so the model states the version it needs and the engine refuses
# rather than reporting a number it cannot stand behind.
requiresEngine: ">=0.2.0"

workflow:
  name: saas-subscription-api
  entry: aws_apigatewayv2_api.public_api
  frequency:
    unit: perMinute
    value: 500

nodes:
  aws_apigatewayv2_api.public_api:
    nodeType: routing
    resourceAddress: aws_apigatewayv2_api.public_api
    provider: aws
    service: AmazonAPIGatewayHTTP
    region: us-east-1
    usageMetrics:
      APIGateway-HTTP-Request: { unit: requests, value: 1 }

  # An HTTP API has no egress price of its own. AWS bills the response bytes
  # as data transfer out to the internet.
  data_transfer.public_api_egress:
    nodeType: external
    resourceAddress: data_transfer.public_api_egress
    provider: aws
    service: AWSDataTransfer
    region: us-east-1
    usageMetrics:
      internetOutGb: { unit: GB, value: 0.00002 }   # 20KB per request

  aws_lambda_function.api:
    nodeType: compute
    resourceAddress: aws_lambda_function.api
    provider: aws
    service: AWSLambda
    region: us-east-1
    usageMetrics:
      invocations: { unit: requests, value: 1 }
      avgDurationMs: { unit: ms, value: 200 }
      memoryMb: { unit: MB, value: 256 }

  # WorkOS: identity, priced per connection and per organization. These are
  # counts, not traffic, so they carry `fixed: true` and their value is a flat
  # monthly total rather than a per-invocation multiplier.
  workos_identity:
    nodeType: external
    resourceAddress: workos_identity
    provider: workos
    service: WorkOS
    region: global
    usageMetrics:
      # First 1M monthly active users are free; overage is $0 on this plan.
      WorkOS-MAU:            { unit: Users,  value: 1200000, fixed: true, shape: free_tier, free: 1000000, overage: 0.0 }
      # $125/mo per SSO connection.
      WorkOS-SSO-Connection: { unit: Conns,  value: 2,       fixed: true, shape: per_unit_flat, rate: 125.0 }
      # $5/mo per organization for audit logs.
      WorkOS-AuditLog-Org:   { unit: Orgs,   value: 3,       fixed: true, shape: per_unit_flat, rate: 5.0 }
      # A flat $99/mo feature, charged once when enabled (value 1).
      WorkOS-CustomDomain:   { unit: Months, value: 1,       fixed: true, shape: flat_subscription, rate: 99.0 }

  # Datadog: a flat subscription per host.
  datadog_observability:
    nodeType: external
    resourceAddress: datadog_observability
    provider: external   # no infra_cost_model/vendors/datadog price rows; the shape carries the rate
    service: Datadog
    region: global
    usageMetrics:
      Hosts: { unit: Hosts, value: 6, fixed: true, shape: flat_subscription, rate: 23.0 }

  aws_dynamodb_table.tenants:
    nodeType: storage
    resourceAddress: aws_dynamodb_table.tenants
    provider: aws
    service: AmazonDynamoDB
    region: us-east-1
    usageMetrics:
      # Each metric counts only the calls over edges of its type. This model
      # has only a read edge into the table, so it charges no writes.
      Dynamo-ReadRequest: { unit: requests, value: 1, edgeType: read }
      Dynamo-WriteRequest: { unit: requests, value: 1, edgeType: write }

edges:
  # Every response leaves AWS as data transfer out
  - from: aws_apigatewayv2_api.public_api
    to: data_transfer.public_api_egress
    rate: 1

  - from: aws_apigatewayv2_api.public_api
    to: aws_lambda_function.api
    rate: 1
  - from: aws_lambda_function.api
    to: aws_dynamodb_table.tenants
    rate: 1
    type: read
