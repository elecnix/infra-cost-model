site_name: infra-cost-model
site_description: DAG-based infrastructure cost model with usage derivation and pricing
site_url: https://elecnix.github.io/infra-cost-model/
repo_url: https://github.com/elecnix/infra-cost-model
repo_name: elecnix/infra-cost-model
edit_uri: ""

# docs/hooks.py generates every page, from the Markdown files at the
# repository root, the examples, the vendor pricing notes and the CLI parser.
# It also sets the navigation.
docs_dir: docs
exclude_docs: |
  hooks.py
hooks:
  - docs/hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
